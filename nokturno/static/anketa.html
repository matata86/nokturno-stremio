<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anketa – Nokturno</title>
<style>
  :root { --pozadi: #0d0c1d; --panel: #17162b; --okraj: #2f2d4d; --text: #e8e6f5; --tlumene: #9a97b8; --akcent: #7b5bf5; --ok: #3ecf8e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 1rem; background: var(--pozadi); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 0; }
  .karta { background: var(--panel); border: 1px solid var(--okraj); border-radius: 16px; padding: 1.6rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .6rem; }
  p { color: var(--tlumene); margin: 0 0 1.4rem; }
  .tlacitka { display: flex; gap: .8rem; }
  button { flex: 1; font: inherit; font-weight: 600; padding: .9rem; border-radius: 12px; border: 1px solid var(--okraj);
           background: var(--pozadi); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--akcent); }
  button.vybrano { background: var(--akcent); border-color: var(--akcent); }
  #stav { margin-top: 1.2rem; color: var(--ok); min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <div class="karta">
    <h1>Měli byste zájem o CZtor i ve Stremiu?</h1>
    <p>CZtor je placený katalog s vlastním účtem. V Kodi a Home Assistantu už jde připojit přes Nokturno. Zajímá nás, jestli ho chcete i ve Stremiu, Nuviu a Streamletu. Hlasování je anonymní.</p>
    <div class="tlacitka">
      <button id="ano" type="button">👍 Ano, chci</button>
      <button id="ne" type="button">👎 Ne, nepotřebuji</button>
    </div>
    <div id="stav"></div>
  </div>
</main>
<script>
(function () {
  var klic = "nokturno-anketa-id", id = "";
  try { id = localStorage.getItem(klic) || ""; } catch (e) {}
  if (!/^[0-9a-f]{32}$/.test(id)) {
    var b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach(function (_, i) { b[i] = Math.random() * 256; });
    id = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    try { localStorage.setItem(klic, id); } catch (e) {}
  }
  function hlasuj(volba) {
    document.getElementById("ano").className = volba === "ano" ? "vybrano" : "";
    document.getElementById("ne").className = volba === "ne" ? "vybrano" : "";
    fetch("__ZAKLAD__/anketa/hlas?v=" + id + "&volba=" + volba, { cache: "no-store" })
      .then(function (r) { document.getElementById("stav").textContent = r.ok ? "Díky za hlas! Odpověď můžeš kdykoli změnit." : "Hlas se nepodařilo uložit, zkus to za chvíli."; })
      .catch(function () { document.getElementById("stav").textContent = "Hlas se nepodařilo uložit, zkus to za chvíli."; });
  }
  document.getElementById("ano").onclick = function () { hlasuj("ano"); };
  document.getElementById("ne").onclick = function () { hlasuj("ne"); };
})();
</script>
</body>
</html>
